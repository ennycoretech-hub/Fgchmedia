<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Preview</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    :root {
      --bg: #0e0c0c;
      --card: #1b1616;
      --card-2: #161212;
      --line: #2c2424;
      --text: #f4efec;
      --muted: #a59893;
      --muted-dim: #6f625e;

      --red: #e5484d;
      --red-bright: #ef5358;
      --red-deep: #d13a3f;
      --red-soft: rgba(229, 72, 77, .13);
      --red-line: rgba(229, 72, 77, .45);

      --radius: 18px;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 24px 48px -28px rgba(0, 0, 0, .95);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      padding: 40px 16px;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 50% -180px, rgba(229, 72, 77, .20), transparent 70%),
        radial-gradient(700px 380px at 100% 0%, rgba(229, 72, 77, .07), transparent 65%),
        var(--bg);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .stage {
      width: 100%;
      max-width: 480px;
      display: grid;
      gap: 22px;
      animation: fadeIn .5s cubic-bezier(.2, .8, .3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------------- Equalizer ---------------- */
    .eq-wrap { display: flex; justify-content: center; }

    .eq {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 88px;
      padding: 0 4px;
    }

    .eq .bar {
      width: 8px;
      height: 20%;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, var(--red-bright), var(--red-deep));
      box-shadow: 0 0 12px -4px rgba(229, 72, 77, .55);
      animation: bar 1.2s ease-in-out infinite;
    }

    .eq .bar:nth-child(1)  { animation-delay: 0s;    height: 30%; }
    .eq .bar:nth-child(2)  { animation-delay: .1s;   height: 55%; }
    .eq .bar:nth-child(3)  { animation-delay: .2s;   height: 82%; }
    .eq .bar:nth-child(4)  { animation-delay: .05s;  height: 45%; }
    .eq .bar:nth-child(5)  { animation-delay: .3s;   height: 70%; }
    .eq .bar:nth-child(6)  { animation-delay: .15s;  height: 92%; }
    .eq .bar:nth-child(7)  { animation-delay: .25s;  height: 60%; }
    .eq .bar:nth-child(8)  { animation-delay: .08s;  height: 35%; }
    .eq .bar:nth-child(9)  { animation-delay: .35s;  height: 75%; }
    .eq .bar:nth-child(10) { animation-delay: .12s;  height: 50%; }
    .eq .bar:nth-child(11) { animation-delay: .22s;  height: 65%; }
    .eq .bar:nth-child(12) { animation-delay: .18s;  height: 40%; }

    @keyframes bar {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(.35); }
    }

    /* ---------------- Card ---------------- */
    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--card), var(--card-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 16px;
      text-align: center;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--red-bright), transparent);
      opacity: .85;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 4.4vw, 1.55rem);
      font-weight: 650;
      letter-spacing: -.028em;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.6;
    }

    /* ---------------- Back button ---------------- */
    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 650;
      letter-spacing: -.005em;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      margin-top: 8px;
      justify-self: center;
      transition: border-color .15s, color .15s, background .15s;
    }
    .back:hover {
      border-color: var(--red);
      color: #ffb3b5;
      background: var(--red-soft);
    }
    .back:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--red-soft), 0 0 0 1px var(--red);
    }

    /* ---------------- Responsive ---------------- */
    @media (max-width: 520px) {
      body { padding: 24px 14px; }
      .card { padding: 26px 20px; border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="stage">
    <div class="eq-wrap">
      <div class="eq" aria-hidden="true">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </div>
    </div>

    <div class="card">
      <h1>This session is currently being uploaded and queued for public access within the next 24 hours.</h1>
      <p>
        It will be available in the library shortly.
        
      </p>
      <a class="back" href="index.html">Back to Library</a>
    </div>
  </main>

</body>

</html>
