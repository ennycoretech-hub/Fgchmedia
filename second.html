<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Record Entry</title>
  <link rel="icon" type="image/png" href="favicon.png">
  
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Open Graph -->
    <meta property="og:title" content="FGC Media — Audio Media Library" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fgcmedia.netlify.app" />
    <meta property="og:image" content="https://fgcmedia.netlify.app/favicon.png" />
    <meta property="og:description" content="Browse and stream our full collection of recorded sessions, talks, and Bible studies — anytime, anywhere." />
    <meta property="og:site_name" content="FGC Media" />

  <style>
    :root {
      --bg: #0e0c0c;
      --card-top: #1b1616;
      --card-bottom: #161212;
      --field: #0b0909;
      --line: #2c2424;
      --line-strong: #3d3131;
      --text: #f4efec;
      --muted: #a59893;
      --muted-dim: #6f625e;
      --red: #e5484d;
      --red-bright: #ef5358;
      --red-deep: #d13a3f;
      --red-soft: rgba(229, 72, 77, .13);
      --red-line: rgba(229, 72, 77, .45);
      --green: #3fb950;
      --radius: 18px;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 24px 48px -28px rgba(0, 0, 0, .95);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      margin: 0;
      padding: 44px 24px 72px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 50% -180px, rgba(229, 72, 77, .20), transparent 70%),
        radial-gradient(700px 380px at 100% 0%, rgba(229, 72, 77, .07), transparent 65%),
        var(--bg);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      display: grid;
      gap: 28px;
    }

    /* ---------------- Header ---------------- */
    .page-head {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 4px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--red);
    }

    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 4px var(--red-soft);
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      line-height: 1.15;
      letter-spacing: -.025em;
      font-weight: 650;
    }

    .sub {
      margin: 0;
      max-width: 64ch;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.6;
    }

    .sub strong {
      color: #ffc9cb;
      font-weight: 600;
    }

    /* ---------------- Banners ---------------- */
    .banner-host {
      display: grid;
      gap: 12px;
    }

    .banner {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .02);
      animation: bannerIn .28s cubic-bezier(.2, .8, .3, 1);
      transition: opacity .25s, transform .25s;
    }

    .banner.is-leaving {
      opacity: 0;
      transform: translateY(-6px);
    }

    @keyframes bannerIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(.99);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .banner-icon {
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      margin-top: 2px;
    }

    .banner-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .banner-body {
      min-width: 0;
    }

    .banner-title {
      font-size: .92rem;
      font-weight: 650;
      color: #fff;
      letter-spacing: -.01em;
      margin-bottom: 3px;
    }

    .banner-msg {
      font-size: .85rem;
      line-height: 1.55;
      opacity: .88;
    }

    .banner-msg code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .8rem;
      background: rgba(0, 0, 0, .35);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 5px;
      color: #ffd4d5;
    }

    .banner-close {
      margin-left: auto;
      flex: 0 0 auto;
      background: transparent;
      border: 1px solid transparent;
      color: inherit;
      opacity: .55;
      font-size: .95rem;
      line-height: 1;
      padding: 4px 7px;
      border-radius: 7px;
      cursor: pointer;
      transition: .15s;
    }

    .banner-close:hover {
      opacity: 1;
      background: rgba(255, 255, 255, .07);
    }

    .banner-error {
      background: linear-gradient(180deg, rgba(229, 72, 77, .16), rgba(229, 72, 77, .06));
      border-color: var(--red-line);
      box-shadow: 0 0 0 1px rgba(229, 72, 77, .08), 0 18px 40px -30px rgba(229, 72, 77, .9);
      color: #ffd7d8;
    }

    .banner-error .banner-icon {
      color: var(--red-bright);
    }

    .banner-success {
      background: linear-gradient(180deg, rgba(63, 185, 80, .15), rgba(63, 185, 80, .05));
      border-color: rgba(63, 185, 80, .42);
      color: #d6f7dc;
    }

    .banner-success .banner-icon {
      color: var(--green);
    }

    .banner-info {
      background: linear-gradient(180deg, rgba(229, 72, 77, .08), rgba(255, 255, 255, .02));
      border-color: var(--line-strong);
      color: var(--muted);
    }

    .banner-info .banner-icon {
      color: var(--muted);
    }

    /* ---------------- Card ---------------- */
    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    /* top loading bar */
    .card-loading {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      overflow: hidden;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }

    .card-loading::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--red-bright), transparent);
      animation: barSlide 1.1s ease-in-out infinite;
    }

    @keyframes barSlide {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(320%);
      }
    }

    form.is-busy .card-loading {
      opacity: 1;
    }

    form.is-busy .grid {
      opacity: .5;
      pointer-events: none;
      transition: opacity .2s;
    }

    form.is-busy .actions .ghost,
    form.is-busy .actions .danger {
      opacity: .5;
      pointer-events: none;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .card-head h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--red-soft);
      border: 1px solid rgba(229, 72, 77, .3);
      color: #ffb3b5;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ---------------- Grid & fields ---------------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: .95rem;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }

    input[type="text"]::placeholder {
      color: var(--muted-dim);
    }

    input[type="text"]:hover,
    select:hover {
      border-color: var(--line-strong);
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--red);
      background: #0d0a0a;
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    /* capitalise names/topics but keep URLs intact */
    input[type="text"]:not(#livelink):not(#listenlink) {
      text-transform: capitalize;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      padding-right: 42px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a59893' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
    }

    select option {
      background: #14100f;
      color: var(--text);
    }

    /* ---------------- Actions ---------------- */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 650;
      letter-spacing: -.005em;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, filter .15s, transform .08s, opacity .15s;
    }

    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--red-soft), 0 0 0 1px var(--red);
    }

    .primary {
      background: linear-gradient(180deg, var(--red-bright), var(--red-deep));
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 12px 26px -14px rgba(229, 72, 77, .95);
    }

    .primary:hover:not(:disabled) {
      filter: brightness(1.07);
    }

    .primary:active:not(:disabled) {
      transform: translateY(1px);
    }

    .primary:disabled {
      cursor: progress;
      filter: saturate(.85) brightness(.95);
    }

    .ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--text);
    }

    .ghost:hover {
      border-color: var(--red);
      color: #ffb3b5;
      background: var(--red-soft);
    }

    .danger {
      background: transparent;
      border-color: #57282a;
      color: #f4a7a9;
    }

    .danger:hover {
      background: #3a1416;
      border-color: #8a2f34;
      color: #fff;
    }

    #clearBtn {
      display: none;
    }

    /* ---------------- Button spinner ---------------- */
    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      animation: spin .65s linear infinite;
    }

    .primary.is-loading .spinner {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------------- Responsive ---------------- */
    @media (max-width: 600px) {
      body {
        padding: 28px 16px 56px;
      }
      h1 {
        font-size: 1.45rem;
      }
      .card {
        padding: 22px 18px;
        border-radius: 16px;
      }
      .actions {
        flex-direction: column;
      }
      .actions button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <header class="page-head">
      <span class="eyebrow">Media Database</span>
      <h1>Service Record Entry</h1>
      <p class="sub">
        Fill the form — every value is stored as a <strong>text</strong> inside an object,
        and the object is pushed into an array.
      </p>
    </header>

    <!-- ================= BANNERS ================= -->
    <div class="banner-host" id="bannerHost" aria-live="polite"></div>

    <!-- ================= FORM ================= -->
    <form class="card" id="entryForm" novalidate>
      <div class="card-loading"></div>

      <div class="card-head">
        <h2>Record details</h2>
        <span class="pill">Saved as texts</span>
      </div>

      <div class="grid">
        <div>
          <label for="day">Day</label>
          <input type="text" id="day" name="day" value="" placeholder="e.g. 6th">
        </div>

        <div>
          <label for="month">Month</label>
          <input type="text" id="month" name="month" value="" placeholder="e.g. October">
        </div>

        <div>
          <label for="year">Year</label>
          <input type="text" id="year" name="year" value="" placeholder="e.g. 2026">
        </div>

        <div>
          <label for="event">Event</label>
          <input type="text" id="event" name="event" value="" placeholder="e.g. Sermon">
        </div>

        <div>
          <label for="minister">Minister</label>
          <input type="text" id="minister" name="minister" value="" placeholder="e.g. Bishop Tunde Bakare">
        </div>

        <div>
          <label for="topic">Topic</label>
          <input type="text" id="topic" name="topic" value="" placeholder="e.g. The Anointing for Exploits">
        </div>

        <div>
          <label for="live">Live</label>
          <select id="live" name="live">
            <option value="0" selected>false</option>
            <option value="1">true</option>
          </select>
        </div>

        <div>
          <label for="text">Text</label>
          <input type="text" id="text" name="text" value="" placeholder="e.g. Acts 10:38, Daniel 11:32">
        </div>

        <div class="full">
          <label for="livelink">Live Link</label>
          <input type="text" id="livelink" name="livelink" value="" placeholder="https://...">
        </div>

        <div class="full">
          <label for="listenlink">Listen Link</label>
          <input type="text" id="listenlink" name="listenlink" value="" placeholder="https://...">
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="submitBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Add Record</span>
        </button>
        <button type="button" class="ghost" id="resetBtn">Reset to Defaults</button>
        <button type="button" class="danger" id="clearBtn">Clear Array</button>
      </div>
    </form>

    <!-- ================= OUTPUT =================
    <div class="card">
      <div class="bar">
        <h2>Array Output</h2>
        <span class="pill" id="count">0 records</span>
      </div>
      <pre id="jsonOut">[]</pre>
      <div id="tableOut"></div>
    </div>
    =========================================== -->
  </div>

  <script>
    /* ---------- The array that holds every record ---------- */
    const records = [];
    let record

    const form = document.getElementById('entryForm');
    const jsonOut = document.getElementById('jsonOut');
    const tableOut = document.getElementById('tableOut');
    const countEl = document.getElementById('count');

    /* =========================================================
       UI LAYER (banners + loader) — no core logic changed below
       ========================================================= */
    const bannerHost = document.getElementById('bannerHost');
    const submitBtn = document.getElementById('submitBtn');
    const btnLabel = submitBtn.querySelector('.btn-label');

    const ICONS = {
      error: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="12.5"></line><circle cx="12" cy="16" r=".6" fill="currentColor" stroke="none"></circle></svg>`,
      success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="8 12.4 11 15.2 16 9.4"></polyline></svg>`,
      info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r=".6" fill="currentColor" stroke="none"></circle></svg>`
    };

    function removeBanner(el) {
      if (!el || el.dataset.leaving) return;
      el.dataset.leaving = '1';
      el.classList.add('is-leaving');
      setTimeout(() => el.remove(), 250);
    }

    function showBanner(type, title, message, options) {
      options = options || {};
      if (options.replace !== false) {
        Array.prototype.slice.call(bannerHost.children).forEach(removeBanner);
      }

      const el = document.createElement('div');
      el.className = 'banner banner-' + type;
      el.setAttribute('role', type === 'error' ? 'alert' : 'status');
      el.innerHTML =
        '<span class="banner-icon">' + (ICONS[type] || ICONS.info) + '</span>' +
        '<div class="banner-body">' +
        '<div class="banner-title"></div>' +
        (message ? '<div class="banner-msg"></div>' : '') +
        '</div>' +
        '<button class="banner-close" type="button" aria-label="Dismiss">&#10005;</button>';

      el.querySelector('.banner-title').textContent = title;
      if (message) el.querySelector('.banner-msg').innerHTML = message;
      el.querySelector('.banner-close').addEventListener('click', function () {
        removeBanner(el);
      });

      bannerHost.prepend(el);

      if (options.autoDismiss) {
        setTimeout(function () {
          removeBanner(el);
        }, options.autoDismiss);
      }
      return el;
    }

    function setLoading(isLoading) {
      form.classList.toggle('is-busy', isLoading);
      submitBtn.disabled = isLoading;
      submitBtn.classList.toggle('is-loading', isLoading);
      btnLabel.textContent = isLoading ? 'Saving…' : 'Add Record';
    }

    /* =========================================================
       CORE LOGIC — unchanged
       ========================================================= */
       
    async function collectRecord() {
      const f = form.elements;
      let a = 0
            for (let i = 0; i < form.elements.length; i++) {
       if(form.elements[i].value != ''){a++}
      }
      if(a  > 8){

      record = {
        day: String(f.day.value.trim()),
        month: String(f.month.value.trim()),
        year: String(f.year.value.trim()), // "2026" not 2026
        event: String(f.event.value.trim()),
        minister: String(f.minister.value.trim()),
        topic: String(f.topic.value.trim()),
        live: String(f.live.value), // "true" / "false" as string
        livelink: String(f.livelink.value.trim()),
        listenlink: String(f.listenlink.value.trim()),
        text: String(f.text.value.trim())
      };
      r = []

      setLoading(true);

      try {
      let ff = await fetch('https://sheetlabs.com/ET/MediaDB_1', {
          method: 'POST',
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify([record])

        })
        if (!ff.ok) {
          throw new Error('The server rejected the request (' + ff.status + ' ' + (ff.statusText || 'Error') + ').');
        }
      
        
        showBanner(
          'success',
          'Record saved',
          'The entry was accepted and stored successfully.',
          { autoDismiss: 5000 }
        );
      }
      catch (error) {
        console.log("Error:", error)
        document.getElementById('clearBtn').style.display = 'block'
        document.getElementById('clearBtn').innerHTML = 'Error'

        const isNetwork = (error instanceof TypeError) ||
          (typeof navigator !== 'undefined' && navigator.onLine === false);

        showBanner(
          'error',
          isNetwork ? 'Network unreachable' : 'Could not save record',
          isNetwork
            ? 'We couldn\'t reach the server. Your device may be offline or the request was blocked. Check your connection and press <strong>Add Record</strong> again — your values are still here.'
            : 'Something went wrong while saving. Your values are still in the form, so you can press <strong>Add Record</strong> to retry.<br><code>' +
              String((error && error.message) || error || 'Unknown error') + '</code>'
        );
      }
      finally {
        setLoading(false);
      }

      return record;
      }else{
        
        showBanner(
          'Error',
          'Record Not Saved',
          'The entry was not accepted fill in all details',
          { autoDismiss: 5000 }
        );
      }
    }

    /* ---------- Events ---------- */
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      records.push(collectRecord()); // push object into the array
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      for (let i = 0; i < form.elements.length; i++) {
        form.elements[i].value = ''
      }
    });
  </script>
</body>

</html>
